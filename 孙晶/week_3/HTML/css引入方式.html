<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- 外联式stylesheet关系为样式表 -->
    <link rel="stylesheet" href="./my.css">
    <style>
        /* 内嵌式  标签选择器 */
        a {
            /* 文字颜色 */
            color:red ;
            /* 字体大小 px：像素 */
            font-size: 30px;
            /* 背景颜色 */
            background-color: aqua;
            width: 400px;
            height: 400px;
        }

        /* 类选择器 .类名 */
        .red{
            color: red;
        }

        
        /* 通配符选择器 很少去除默认的margin和padding会用 */
        *{
            color: red;
        }
    </style>
</head>
<body>
    <p>这是一个p标签</p>
    <a>这是a标签</a>
    <!--  行内式 -->
    <div style="color: aqua; font-size: 30px;">这是div标签</div>

    <b class="red">类选择器</b>
    <div id="blue">id选择器</div> 

</body>
</html>
